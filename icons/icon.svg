<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="eGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <g filter="url(#glow)">
    <!-- Checklist Base Silhouette -->
    <rect x="110" y="80" width="292" height="352" rx="36" fill="#0f172a" fill-opacity="0.25" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" />

    <!-- Checklist Lines -->
    <line x1="160" y1="135" x2="352" y2="135" stroke="#ffffff" stroke-opacity="0.4" stroke-width="8" stroke-linecap="round" />
    <line x1="160" y1="170" x2="280" y2="170" stroke="#ffffff" stroke-opacity="0.4" stroke-width="8" stroke-linecap="round" />

    <!-- Stylized "E" / Mic Motif -->
    <!-- Vertical Spine -->
    <rect x="175" y="210" width="34" height="175" rx="17" fill="url(#eGrad)" />
    <!-- Top Bar -->
    <rect x="175" y="210" width="130" height="32" rx="16" fill="url(#eGrad)" />
    <!-- Middle Bar (Soundwave Accent) -->
    <rect x="175" y="280" width="105" height="30" rx="15" fill="url(#eGrad)" />
    <!-- Bottom Bar -->
    <rect x="175" y="353" width="130" height="32" rx="16" fill="url(#eGrad)" />

    <!-- Microphone Center Capsule Accent -->
    <rect x="290" y="210" width="46" height="74" rx="23" fill="#6366f1" stroke="#ffffff" stroke-width="5" />
    <path d="M 276 250 C 276 295, 350 295, 350 250" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <line x1="313" y1="295" x2="313" y2="320" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

    <!-- Checkmark Badge -->
    <circle cx="370" cy="370" r="46" fill="#10b981" stroke="#ffffff" stroke-width="6" />
    <path d="M 353 370 L 366 383 L 389 360" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
